[package]
name = "tokenizer"
description = "Byte-level BPE tokenizer and chat template, read from the GGUF."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
gguf = { path = "../gguf" }
fancy-regex = { version = "0.13", default-features = false, features = ["std", "perf"] }
# Only the Unicode tables the pre-tokenizer pattern uses (\p{L}, \p{M},
# \p{N}, \s): general categories and Perl classes, not all of them.
regex-syntax = { version = "0.8", default-features = false, features = ["std", "unicode-gencat", "unicode-perl"] }

[lints]
workspace = true
