name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, lint and test
    # The binary targets Windows (x86_64-pc-windows-gnu): the NPU engine uses
    # Win32 and Level Zero, and the tests run where they are built.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # The GNU host toolchain; `.cargo/config.toml` links with the runner's
      # MinGW-w64 (`x86_64-w64-mingw32-gcc`).
      # Pinned: a newer clippy adds lints that `-D warnings` turns into errors.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1-x86_64-pc-windows-gnu
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      # Without Vulkan (CPU / NPU only) and with it (GPU offload).
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features cli/vulkan -- -D warnings
      # GPU and NPU tests skip themselves without the device; tests that need
      # model files are ignored by default.
      - run: cargo test --workspace --release
      - run: cargo test --workspace --release --features cli/vulkan

  deploy:
    name: Deploy x64
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Pinned: a newer clippy adds lints that `-D warnings` turns into errors.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1-x86_64-pc-windows-gnu
      # LTO, stripped; depends only on system DLLs (vulkan-1.dll and the NPU
      # driver are loaded at run time).
      - run: cargo build --profile deploy -p cli --features vulkan
      - name: Package
        shell: pwsh
        run: |
          $out = "target/package/qwen.rs"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target/deploy/cli.exe, README.md, CHANGELOG, LICENSE $out
          Copy-Item -Recurse docs, profiles $out
          & "$out/cli.exe" --version
      - uses: actions/upload-artifact@v7
        with:
          name: qwen.rs-x64
          path: target/package/
      # A pushed tag `vX.Y.Z` publishes the package as a release.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path target/package/qwen.rs -DestinationPath "qwen.rs-${{ github.ref_name }}-x64.zip"
          gh release create "${{ github.ref_name }}" "qwen.rs-${{ github.ref_name }}-x64.zip" --title "qwen.rs ${{ github.ref_name }}" --generate-notes
